<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | 상인월드</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/landing.css">
<link rel="stylesheet" href="../css/ds-auth.css">
</head>
<body class="sw-landing login-page">
<!-- DS 로그인 (sanginworld-ds/login.html) 이식 -->
<main class="auth">

  <!-- 좌측: 로그인 폼 -->
  <section class="auth__panel">
    <a class="auth__logo" href="index.html"><img src="../image/logo-sanginworld.svg" alt="상인월드"></a>

    <div class="auth__form-wrap">
      <h1 class="auth__title">로그인</h1>
      <p class="auth__sub">상인월드 계정으로 로그인하세요.</p>

      <form class="login__form" data-login-form novalidate>
        <div class="login-field">
          <label class="login-field__label" for="loginEmail">이메일</label>
          <input class="login-field__input" id="loginEmail" type="email" inputmode="email" autocomplete="username" placeholder="이메일을 입력해주세요." data-login-email required>
        </div>

        <div class="login-field">
          <label class="login-field__label" for="loginPw">비밀번호</label>
          <div class="login-field__pw">
            <input class="login-field__input" id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호를 입력해주세요." data-login-pw required>
            <button class="login-field__toggle" type="button" data-login-pw-toggle aria-label="비밀번호 표시">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div class="login__row login__row--end">
          <a class="login__link" href="password-reset.html">비밀번호 찾기</a>
        </div>

        <button class="login__submit" type="submit" data-login-submit disabled>로그인</button>
      </form>

      <p class="login__foot">계정이 없으신가요? <a class="login__link login__link--strong" href="signup.html">무료로 시작하기</a></p>
    </div>
  </section>

  <!-- 우측: 메시 그라디언트 + AI 아바타 채팅 -->
  <aside class="auth__aside" aria-hidden="true">
    <canvas class="auth__mesh mesh-canvas"></canvas>
    <div class="auth__aside-inner">
      <div class="auth__copy">
        <h2 class="auth__copy-title">이미지 한 장으로<br>시작하는 가장 쉬운 AI</h2>
        <p class="auth__copy-sub">로그인하고 오늘의 콘텐츠를 만들어보세요.</p>
      </div>

      <!-- index와 동일한 AI 아바타 채팅(flexhero prompt + initSequence) -->
      <form class="flexhero__prompt" >
        <span class="flexhero__avatar" aria-hidden="true"></span>
        <div class="flexhero__prompt-body">
          <div class="flexhero__loading" data-hero-loading hidden>
            <span class="flexhero__loading-thumb" aria-hidden="true"></span>
            <div class="flexhero__loading-info">
              <span class="flexhero__loading-label">매장사진.jpg 업로드 중…</span>
              <span class="flexhero__loading-bar"><span data-hero-bar></span></span>
            </div>
          </div>
          <span class="flexhero__prompt-text" data-hero-text><span data-hero-type></span><span class="flexhero__caret" aria-hidden="true"></span></span>
          <span class="flexhero__attach-badge" data-hero-badge hidden>
            <i data-lucide="image-up"></i>
            매장사진.jpg
          </span>
        </div>
      </form>
    </div>
  </aside>

</main>
<script src="../vendor/lucide.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/mesh.js"></script>
<script src="../js/landing.js"></script>
<script src="../js/ds-login.js"></script>
</body>
</html>
