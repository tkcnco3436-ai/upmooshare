<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 찾기 | 상인월드</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/landing.css">
<link rel="stylesheet" href="../css/ds-auth.css">
</head>
<body class="sw-landing login-page">
<!-- DS 비밀번호 찾기 (sanginworld-ds/password-reset.html) 이식 -->
<main class="auth">

  <!-- 좌측: 폼 패널 -->
  <section class="auth__panel">
    <a class="auth__logo" href="index.html"><img src="../image/logo-sanginworld.svg" alt="상인월드"></a>

    <div class="auth__form-wrap">
      <h1 class="auth__title">비밀번호 찾기</h1>
      <p class="auth__sub">가입된 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>

      <p class="auth__notice">가입 시 사용한 이메일 주소를 입력해주세요. 비밀번호 재설정 링크를 발송해드립니다. <b>(링크 유효시간 30분)</b></p>

      <form class="login__form" data-reset-form novalidate>
        <div class="login-field">
          <label class="login-field__label" for="resetEmail">이메일</label>
          <input class="login-field__input" id="resetEmail" type="email" inputmode="email" autocomplete="email" placeholder="가입하신 이메일을 입력해주세요." data-reset-email required>
        </div>

        <button class="login__submit" type="submit" data-reset-submit disabled>재설정 링크 보내기</button>
      </form>

      <p class="auth__sent" data-reset-sent hidden>
        <i data-lucide="mail-check"></i>
        재설정 링크를 보냈어요. 메일함을 확인해주세요.
      </p>

      <p class="login__foot"><a class="login__link login__link--strong" href="login.html">로그인으로 돌아가기</a></p>
    </div>
  </section>

  <!-- 우측: 메시 그라디언트 + AI 아바타 채팅 (로그인·회원가입과 동일 구조) -->
  <aside class="auth__aside" aria-hidden="true">
    <canvas class="auth__mesh mesh-canvas"></canvas>
    <div class="auth__aside-inner">
      <div class="auth__copy">
        <h2 class="auth__copy-title">이미지 한 장으로<br>시작하는 가장 쉬운 AI</h2>
        <p class="auth__copy-sub">비밀번호를 재설정하고 다시 시작해보세요.</p>
      </div>

      <form class="flexhero__prompt">
        <span class="flexhero__avatar" aria-hidden="true"></span>
        <div class="flexhero__prompt-body">
          <div class="flexhero__loading" data-hero-loading hidden>
            <span class="flexhero__loading-thumb" aria-hidden="true"></span>
            <div class="flexhero__loading-info">
              <span class="flexhero__loading-label">매장사진.jpg 업로드 중…</span>
              <span class="flexhero__loading-bar"><span data-hero-bar></span></span>
            </div>
          </div>
          <span class="flexhero__prompt-text" data-hero-text><span data-hero-type></span><span class="flexhero__caret" aria-hidden="true"></span></span>
          <span class="flexhero__attach-badge" data-hero-badge hidden>
            <i data-lucide="image-up"></i>
            매장사진.jpg
          </span>
        </div>
      </form>
    </div>
  </aside>

</main>
<script src="../vendor/lucide.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/mesh.js"></script>
<script src="../js/landing.js"></script>
<script src="../js/ds-auth-forms.js"></script>
</body>
</html>
