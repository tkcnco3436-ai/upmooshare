<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 | 상인월드</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/landing.css">
<link rel="stylesheet" href="../css/ds-auth.css">
</head>
<body class="sw-landing login-page">
<!-- DS 회원가입 (sanginworld-ds/signup.html) 이식 — 2스텝 위자드 -->
<main class="auth">

  <!-- 좌측: 회원가입 폼 -->
  <section class="auth__panel">
    <a class="auth__logo" href="index.html"><img src="../image/logo-sanginworld.svg" alt="상인월드"></a>

    <div class="auth__form-wrap auth__form-wrap--wide">
      <h1 class="auth__title" data-su-title>회원가입</h1>
      <p class="auth__sub" data-su-subtitle>상인월드 계정을 만들어보세요.</p>

      <!-- 스텝 인디케이터 -->
      <div class="su-steps" data-su-steps aria-hidden="true">
        <span class="su-steps__count"><b data-step-current>1</b> / 2</span>
      </div>

      <form class="login__form" data-signup-form novalidate>
        <!-- STEP 1 : 정보 입력 -->
        <div data-su-step="1">
          <div class="login-field">
            <label class="login-field__label" for="suName">이름</label>
            <input class="login-field__input" id="suName" type="text" autocomplete="name" placeholder="이름을 입력해주세요." data-su-name required>
          </div>

          <div class="login-field">
            <label class="login-field__label" for="suEmail">이메일</label>
            <div class="login-field__row">
              <input class="login-field__input" id="suEmail" type="email" inputmode="email" autocomplete="email" placeholder="이메일을 입력해주세요." data-su-email required>
              <button class="login-field__btn" type="button" data-su-email-check>중복확인</button>
            </div>
            <p class="login-field__msg" data-su-email-msg hidden></p>
          </div>

          <div class="login-field">
            <label class="login-field__label" for="suPw">비밀번호</label>
            <div class="login-field__pw">
              <input class="login-field__input" id="suPw" type="password" autocomplete="new-password" placeholder="비밀번호를 입력해주세요." data-su-pw required>
              <button class="login-field__toggle" type="button" data-su-pw-toggle aria-label="비밀번호 표시"><i data-lucide="eye"></i></button>
            </div>
            <ul class="login-rules" data-su-rules>
              <li data-rule="combo"><i data-lucide="check"></i>영문 + 숫자 + !@# 조합</li>
              <li data-rule="length"><i data-lucide="check"></i>최소 8자 이상 입력해주세요.</li>
              <li data-rule="match"><i data-lucide="check"></i>비밀번호 일치</li>
            </ul>
          </div>

          <div class="login-field">
            <label class="login-field__label" for="suPw2">비밀번호 확인</label>
            <div class="login-field__pw">
              <input class="login-field__input" id="suPw2" type="password" autocomplete="new-password" placeholder="비밀번호를 한번 더 입력해주세요." data-su-pw2 required>
              <button class="login-field__toggle" type="button" data-su-pw2-toggle aria-label="비밀번호 표시"><i data-lucide="eye"></i></button>
            </div>
          </div>

          <div class="login-field">
            <label class="login-field__label" for="suCode">가입 코드</label>
            <input class="login-field__input" id="suCode" type="text" placeholder="가입 코드가 있다면 입력해주세요. (선택)" data-su-code>
          </div>

          <button class="login__submit" type="button" data-su-next disabled>다음</button>
        </div>

        <!-- STEP 2 : 약관 동의 -->
        <div data-su-step="2" hidden>
          <ul class="su-agree">
            <li class="su-agree__all">
              <label class="su-check">
                <input type="checkbox" data-agree-all>
                <span class="su-check__box"><i data-lucide="check"></i></span>
                <span class="su-check__label">전체동의</span>
              </label>
            </li>
            <li class="su-agree__item">
              <label class="su-check">
                <input type="checkbox" data-agree data-required data-agree-key="terms">
                <span class="su-check__box"><i data-lucide="check"></i></span>
                <span class="su-check__label"><em class="su-req">(필수)</em> 이용약관 동의</span>
              </label>
              <button class="su-agree__view" type="button" data-agree-view="terms">보기</button>
            </li>
            <li class="su-agree__item">
              <label class="su-check">
                <input type="checkbox" data-agree data-required data-agree-key="privacy">
                <span class="su-check__box"><i data-lucide="check"></i></span>
                <span class="su-check__label"><em class="su-req">(필수)</em> 개인정보 수집 및 이용 동의</span>
              </label>
              <button class="su-agree__view" type="button" data-agree-view="privacy">보기</button>
            </li>
            <li class="su-agree__item">
              <label class="su-check">
                <input type="checkbox" data-agree data-agree-key="third">
                <span class="su-check__box"><i data-lucide="check"></i></span>
                <span class="su-check__label"><em class="su-opt">(선택)</em> 제3자 정보 제공 및 국외 이전 동의</span>
              </label>
              <button class="su-agree__view" type="button" data-agree-view="third">보기</button>
            </li>
            <li class="su-agree__item">
              <label class="su-check">
                <input type="checkbox" data-agree data-agree-key="marketing">
                <span class="su-check__box"><i data-lucide="check"></i></span>
                <span class="su-check__label"><em class="su-opt">(선택)</em> 마케팅 정보 수신 동의</span>
              </label>
              <button class="su-agree__view" type="button" data-agree-view="marketing">보기</button>
            </li>
          </ul>

          <div class="su-actions">
            <button class="login__submit su-actions__back" type="button" data-su-back>이전</button>
            <button class="login__submit" type="submit" data-su-submit disabled>가입 완료</button>
          </div>
        </div>
      </form>

      <p class="login__foot">이미 계정이 있으신가요? <a class="login__link login__link--strong" href="login.html">로그인</a></p>
    </div>
  </section>

  <!-- 우측: 메시 그라디언트 + AI 아바타 채팅 -->
  <aside class="auth__aside" aria-hidden="true">
    <canvas class="auth__mesh mesh-canvas"></canvas>
    <div class="auth__aside-inner">
      <div class="auth__copy">
        <h2 class="auth__copy-title">이미지 한 장으로<br>시작하는 가장 쉬운 AI</h2>
        <p class="auth__copy-sub">가입하고 첫 콘텐츠를 무료로 만들어보세요.</p>
      </div>

      <form class="flexhero__prompt" >
        <span class="flexhero__avatar" aria-hidden="true"></span>
        <div class="flexhero__prompt-body">
          <div class="flexhero__loading" data-hero-loading hidden>
            <span class="flexhero__loading-thumb" aria-hidden="true"></span>
            <div class="flexhero__loading-info">
              <span class="flexhero__loading-label">매장사진.jpg 업로드 중…</span>
              <span class="flexhero__loading-bar"><span data-hero-bar></span></span>
            </div>
          </div>
          <span class="flexhero__prompt-text" data-hero-text><span data-hero-type></span><span class="flexhero__caret" aria-hidden="true"></span></span>
          <span class="flexhero__attach-badge" data-hero-badge hidden>
            <i data-lucide="image-up"></i>
            매장사진.jpg
          </span>
        </div>
      </form>
    </div>
  </aside>

</main>

<!-- 약관 상세 모달 -->
<div class="su-modal" data-su-modal role="dialog" aria-modal="true" aria-labelledby="suModalTitle">
  <div class="su-modal__backdrop" data-su-modal-close></div>
  <div class="su-modal__panel">
    <div class="su-modal__head">
      <h3 class="su-modal__title" id="suModalTitle" data-su-modal-title>약관</h3>
      <button class="su-modal__close" type="button" data-su-modal-close aria-label="닫기"><i data-lucide="x"></i></button>
    </div>
    <div class="su-modal__body" data-su-modal-body></div>
    <div class="su-modal__foot">
      <button class="su-modal__agree" type="button" data-su-modal-agree>동의하고 닫기</button>
    </div>
  </div>
</div>
<script src="../vendor/lucide.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/mesh.js"></script>
<script src="../js/landing.js"></script>
<script src="../js/ds-signup.js"></script>
</body>
</html>
