/* ===== shadcn/ui(zinc) 기반 토큰 — orbit-mail 스타일 ===== */
:root{

  --gray-050:#fafafa; --gray-100:#f4f4f5; --gray-200:#e4e4e7;

  --orange-100:#ffedd5; --orange-500:#ea580c; --orange-700:#c2410c;
  --red-100:#fee2e2; --red-500:#dc2626; --red-700:#b91c1c;

  /* 시맨틱 (light) */
  --bg-canvas:#fafafa; --bg-surface:#ffffff; --topbar-bg:rgba(255,255,255,.8);
  --fg-strong:#09090b; --fg:#3f3f46; --fg-hint:#71717a;

  color-scheme:light;
}

/* ===== 다크 모드 (토글 data-theme="dark" 또는 시스템 설정) ===== */
:root[data-theme="dark"],
:root:not([data-theme="light"]) {}
[data-theme="dark"]{
  --bg-canvas:#09090b; --bg-surface:#0c0c0f; --topbar-bg:rgba(9,9,11,.8);
  --fg-strong:#fafafa; --fg:#d4d4d8; --fg-hint:#a1a1aa;
  --border:#27272a; --muted:#1e1e21;
  --accent:#fafafa; --on-accent:#18181b; --accent-weak:#27272a; --accent-hover:#e4e4e7;
  --primary:var(--accent); --primary-fg:#fafafa; --primary-soft:var(--accent-weak);

    --border:#27272a; --muted:#1e1e21;
    --accent:#fafafa; --on-accent:#18181b; --accent-weak:#27272a; --accent-hover:#e4e4e7;

    --shadow-md:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.5);

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:var(--font);background:var(--bg-canvas);color:var(--fg);

.layout{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh;}

.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg-surface);

/* 브랜드 헤더 밴드 — 본문 topbar와 같은 높이(--topbar-h)로 두어 하단 구분선을 topbar 라인과 정렬 */
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--fg-strong);letter-spacing:-0.3px;
  height:var(--topbar-h);flex:none;margin:0 -16px;padding:0 20px;border-bottom:1px solid var(--border);}
.brand__mark{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--on-accent);}
.brand__sub{font-size:11px;font-weight:600;color:var(--fg-hint);letter-spacing:0.06em;text-transform:uppercase;}
/* 브랜드 아래 풀블리드 구분선 — 사이드바 좌우 패딩 무시하고 끝까지 */
.sidebar__rule{height:1px;background:var(--border);margin:0 -16px;}
.nav__group{margin-bottom:18px;}
.nav__label{font-size:11px;font-weight:600;color:var(--fg-hint);letter-spacing:0.08em;text-transform:uppercase;padding:0 8px;margin-bottom:6px;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav__item{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:var(--radius-sm);

.nav__item:hover{background:var(--muted);color:var(--fg-strong);}
.nav__item.is-active{background:var(--primary-soft);color:var(--primary-fg);font-weight:600;}
.nav__item-title{font-size:13.5px;}
.nav__item-date{font-size:11px;color:var(--fg-hint);font-variant-numeric:tabular-nums;}
.nav__item.is-active .nav__item-date{color:var(--primary-fg);opacity:.8;}

/* ===== Main ===== */
.main{min-width:0;display:flex;flex-direction:column;}

.main__body{display:flex;align-items:flex-start;gap:28px;width:100%;max-width:1060px;margin:0 auto;padding:32px 28px 0;}
.topbar{position:sticky;top:0;height:var(--topbar-h);display:flex;align-items:center;gap:12px;
  padding:0 28px;background:var(--topbar-bg);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--border);z-index:30;}
.crumb{font-size:13px;font-weight:500;color:var(--fg-hint);display:flex;align-items:center;gap:6px;min-width:0;}
.crumb b{color:var(--fg-strong);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.crumb .sep{opacity:.5;}
.topbar__spacer{flex:1;}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--radius-btn);
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s;}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--primary);color:var(--on-accent);}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:active{opacity:.9;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--fg-strong);}
.btn-ghost:hover{background:var(--muted);}
.hamburger{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--radius-btn);
  border:1px solid var(--border);background:var(--bg-surface);cursor:pointer;color:var(--fg-strong);}
.hamburger svg{width:18px;height:18px;}

.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--radius-btn);

.btn-icon:hover{background:var(--muted);}
.btn-icon svg{width:17px;height:17px;}
.btn-icon .ti--light{display:none;} .btn-icon .ti--dark{display:inline-flex;}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .btn-icon .ti--light{display:inline-flex;}

}

/* ===== Doc ===== */
.doc{flex:1;min-width:0;max-width:760px;padding:0 0 96px;}
.doc__eyebrow{font-size:12px;font-weight:600;color:var(--primary-fg);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:6px;}
.doc h1{font-size:32px;line-height:1.3;font-weight:800;color:var(--fg-strong);letter-spacing:-0.4px;margin:0 0 8px;}
.doc h2{font-size:22px;line-height:1.35;font-weight:700;color:var(--fg-strong);letter-spacing:-0.2px;margin:36px 0 12px;padding-top:8px;scroll-margin-top:72px;}
.doc h3{font-size:17px;line-height:1.4;font-weight:700;color:var(--fg-strong);margin:24px 0 8px;scroll-margin-top:72px;}
.doc h4{font-size:15px;font-weight:700;color:var(--fg-strong);margin:18px 0 6px;}
.doc p{margin:10px 0;color:var(--fg);}
.doc ul,.doc ol{margin:10px 0;padding-left:22px;color:var(--fg);}
.doc li{margin:5px 0;}
.doc li::marker{color:var(--fg-hint);}
/* 체크리스트(task list) — `- [x]` / `- [ ]` */
.doc ul.tasklist{list-style:none;padding-left:0;margin:12px 0;}
.doc ul.tasklist li.task{position:relative;padding-left:30px;margin:8px 0;font-weight:500;color:var(--fg-strong);}
.doc ul.tasklist li.task::before{content:"";position:absolute;left:0;top:1px;width:18px;height:18px;border:1.5px solid var(--border);border-radius:5px;background:var(--bg-surface);}
.doc ul.tasklist li.task.is-done{color:var(--fg);}
.doc ul.tasklist li.task.is-done::before{background:var(--green-500);border-color:var(--green-500);}
.doc ul.tasklist li.task.is-done::after{content:"";position:absolute;left:6px;top:4px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.doc ul.tasklist li.subnote{position:relative;padding-left:30px;margin:2px 0 6px;font-size:13px;color:var(--fg-hint);list-style:none;}
.doc ul.tasklist li.subnote::before{content:"–";position:absolute;left:12px;color:var(--fg-hint);}
/* 인라인 배지(예: 0720공유) — 항목 우측 정렬 */
.doc-badge{float:right;margin-left:8px;font-size:11px;font-weight:600;color:var(--primary-fg);
  background:var(--accent-weak);border:1px solid var(--border);border-radius:999px;padding:2px 9px;line-height:1.6;white-space:nowrap;}
.doc-badge--red{float:none;margin:0 8px 0 0;vertical-align:middle;color:#fff;background:var(--red-500);border-color:var(--red-500);}

.doc hr{border:none;border-top:1px solid var(--border);margin:28px 0;}
.doc pre{margin:12px 0;background:var(--gray-900);border-radius:var(--radius-card);padding:14px 16px;overflow-x:auto;}
.doc pre code{display:block;background:none;border:none;padding:0;color:oklch(0.93 0 0);

.twrap{overflow-x:auto;margin:14px 0;border:1px solid var(--border);border-radius:var(--radius-card);}
.doc table{width:100%;border-collapse:collapse;font-size:13.5px;}
.doc th,.doc td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top;}
.doc th{background:var(--muted);font-weight:600;font-size:12.5px;color:var(--fg-hint);white-space:nowrap;}
.doc tr:last-child td{border-bottom:none;}
.doc td code{white-space:nowrap;}

/* ===== TOC ===== */
/* On this page — 본문(main__body) 안 좌측 nav 카드. 헤더(topbar) 아래에서 sticky */
.toc{order:-1;flex:none;width:var(--toc-w);}
.toc[hidden]{display:none;}
.toc__card{position:sticky;top:calc(var(--topbar-h) + 32px);

.toc nav{display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--border);}
.toc a{font-size:12.5px;color:var(--fg-hint);padding:4px 0 4px 12px;margin-left:-1px;border-left:2px solid transparent;transition:color .12s,border-color .12s;}
.toc a:hover{color:var(--fg-strong);}
.toc a.lvl-3{padding-left:24px;font-size:12px;}
.toc a.is-active{color:var(--primary-fg);border-left-color:var(--primary);font-weight:600;}

/* ===== Responsive ===== */

  .sidebar.is-open{transform:none;}

  .doc{padding:24px 18px 80px;}

.ui-gallery{margin:18px 0 8px;}

.ui-tab:hover{color:var(--fg-strong);}
.ui-tab.is-active{color:var(--fg-strong);border-bottom-color:var(--primary);}
.ui-panel{display:none;}
.ui-panel.is-active{display:block;}

.ui-state__title{font-size:14px;font-weight:700;color:var(--fg-strong);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.ui-state__title .n{display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 7px;border-radius:6px;
  background:var(--muted);color:var(--fg-hint);font-size:11px;font-variant-numeric:tabular-nums;}

.ui-shot{border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;background:var(--bg-surface);box-shadow:var(--shadow-md);}

</style>

<script type="text/markdown" data-report-id="0804" data-category="업무 공유" data-date="2026-08-04" data-title="0804 업무 공유" data-file="0804업무공유.md">
# 0804 업무 공유 — 영상생성 시안 2종 (생성 → 만들기 → 완료 → 내영상)

작성일: 2026-08-04 · 대상: 개발 전달 및 팀 공유

---

## 1. 요약

- 영상생성 흐름을 **두 가지 방식**으로 만들어 각 4화면씩, 총 **8화면**을 완성했습니다. {{0804공유}}
- **시안 1 · 위자드형** — 왼쪽 단계 레일을 두고 한 단계씩 밟아 갑니다. {{0804공유}}
- **시안 2 · AI 아바타 채팅형** — 한 번에 한 가지만 묻는 대화 흐름입니다. {{0804공유}}
- 두 시안 모두 **생성 → 만들기 → 완료 → 내영상**까지 이어져, 처음부터 끝까지 눌러 볼 수 있습니다.
- 8화면만 모은 **독립 실행 폴더**(`0804_영상생성시안_공유`)를 별도로 전달합니다.
- 어느 방식으로 갈지는 **선택 필요** 사항입니다. 고른 뒤에 나머지 시안을 정리하고 기능정의서·화면정의서를 작성하겠습니다.
- **시현 주소**(테스트)에서 위자드형을 직접 눌러 볼 수 있습니다 — 개선 중간에 올린 것이라 이 문서의 화면과 UI가 다를 수 있습니다. {{0804공유}}
- **고도화 항목 5건**의 처리 결과를 2절에 바뀌기 전/후로 정리했습니다 — 완료 3건, **반영X** 2건(등급 추천 · 민감 주제 필터링)입니다. {{0804공유}}

> 만들기 단계는 실제 생성이 아니라 **4초 × 3단계 시연**입니다. 숫자·목록·영상은 예시값입니다.

### 시현 주소 (테스트)

아래 주소에서 직접 눌러 볼 수 있습니다.

| 화면 | 주소 |
| --- | --- |
| 목록(시작) | https://sw-test-lz3g.vercel.app |
| 영상생성 | https://sw-test-lz3g.vercel.app/video/create |
| 만들기 | https://sw-test-lz3g.vercel.app/video/processing |
| 완료 | https://sw-test-lz3g.vercel.app/video/result |
| 내영상 | https://sw-test-lz3g.vercel.app/video/my |

> **이 시현 화면은 화면 개선 작업 중간에 올린 것입니다.** 이후로도 개선이 이어졌기 때문에 **이번에 공유하는 화면과 UI가 다를 수 있습니다.** 최종 형태는 이 문서와 전달 폴더(`0804_영상생성시안_공유`)를 기준으로 봐 주세요.
>
> 또한 시현 주소에는 **위자드형 4화면만** 올라가 있습니다. AI 아바타 채팅형은 포함되지 않아, 두 시안을 비교하실 때는 전달 폴더를 열어 주세요.

## 2. 영상 생성 페이지 고도화 [ 기획, 디자인 → 개발 ]

각 항목이 어떻게 바뀌었는지 **바뀌기 전 / 바뀐 후**로 적었습니다.

| 항목 | 상태 |

- 막혔을 때 **보여줄 문구**와 다음 행동(다른 주제 고르기 / 문의).
- 막힌 경우 **크레딧을 차감하는지** — 차감하지 않는다면 그 문구도 화면에 있어야 합니다.

## 4. 공통 동작

- 상단 탭으로 **영상 만들기 ↔ 내 영상**을 오갑니다. 모바일은 헤더 바로 아래 붙는 밑줄 탭, PC 는 알약 탭입니다.
- 추천은 **무료 3회**, 다 쓰면 회당 2크레딧입니다. 다시 추천을 누를 때도 분석 모달이 뜹니다.
- **템플릿 영역은 구역만 잡아 둔 상태**입니다. 탭과 카드 자리·동작만 만들어 두었고, 실제 템플릿 목록과 내용은 채우지 않았습니다(지금 보이는 3개는 자리를 보여주는 예시입니다).

- 영상 생성은 **12크레딧**입니다. 추천이나 템플릿을 고르기 전에는 생성 버튼이 잠겨 있습니다.
- 유의 문구(AI는 실수할 수 있습니다 · 12크레딧 차감)는 **누르는 버튼 바로 위**에 둡니다.
- 이미지 분석 · 다시 추천 모달은 **모바일에서도 화면 중앙**에 뜹니다. 삭제 확인 모달은 하단 시트를 유지했습니다.

## 5. 시안 1 · 위자드형 (4화면)

**1) 영상생성** — 사진 → 스타일 2단계

- 사진을 올리기 전에는 다음으로 넘어갈 수 없고, 다음을 누르면 분석 모달이 돈 뒤 스타일 단계로 갑니다.
- 스텝 2 맨 위에 **첨부한 사진을 갤러리형 썸네일로 다시 보여줍니다** — 무엇을 보고 추천이 나왔는지 확인용입니다. 썸네일을 누르면 원본이 열립니다.
- 사진 교체는 스텝 1 의 「다시 고르기」로만 합니다.

**2) 만들기** — 이미지 분석 → 프롬프트 생성 → 영상 만들기

- 단계마다 4초씩 완료되고, 마지막 단계가 끝나면 완료 화면으로 자동 이동합니다.
- 실패 화면은 마크업에 숨겨 뒀습니다.

**3) 완료** — 영상 · 소요 시간 · 사용 크레딧 · 보관 기한

- 다운로드(검정)를 한 줄로 두고 아래에 새로 만들기 · 내 영상 · 삭제를 나란히 놓았습니다.

**4) 내영상** — 목록

- 왼쪽 레일에서 분류(전체 · 완성 · 만드는 중)를 고릅니다. 개수는 목록에서 세어 표시합니다.
- 완성 카드는 **실제 영상이 재생**됩니다. 카드를 누르면 재생 창이 열립니다.
- 「삭제하기」를 누르면 선택 모드로 들어가고, 고른 영상만 지웁니다.

## 6. 시안 2 · AI 아바타 채팅형 (4화면)

**1) 영상생성** — 대화로 진행

- 사진을 올리면 **대화 안에서** 올리는 중 표시가 돌고, 끝나면 사진이 말풍선으로 붙습니다. 사진 아래에 「이미지 다시 선택」이 있습니다.
- 다음을 누르면 분석 모달이 돌고 추천 3개가 등장합니다. 추천·템플릿 카드는 대화와 같은 폭입니다.

**2) 만들기** — 접히는 진행 카드

- 진행 상황을 카드 하나로 모았습니다. 제목 줄에 진행률이 있고, 카드를 접을 수 있습니다.
- 단계마다 표식 · 이름 · 걸린 시간이 서고, 완료된 구간은 연결선이 초록으로 채워집니다.

**3) 완성** — 결과

- 영상은 가로·세로 어느 비율이든 **같은 크기 무대 안에** 들어가 잘리지 않습니다.
- 다운로드 아래 새로 만들기 · 내 영상 · 삭제를 놓았습니다. 모바일에서는 글자가 잘리지 않게 2열로 내려갑니다.

**4) 내영상** — 목록

- 목록은 대화가 아니라 자료이므로 말풍선 없이 카드로 두었습니다(PC 2열).
- 분류와 「삭제하기」가 한 줄에 있고, 선택 모드에서는 전체 선택 · 선택 개수 · 취소 · 선택 삭제로 바뀝니다.

  // ---------- 마크다운 렌더러 (headings/hr/list/table/bold/code/link) ----------
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" class="doc-img" loading="lazy">');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\{\{!([^}]+)\}\}/g,'<span class="doc-badge doc-badge--red">$1</span>');
    s = s.replace(/\{\{([^}]+)\}\}/g,'<span class="doc-badge">$1</span>');
    return s;
  }
  function slug(s){ return s.toLowerCase().replace(/[^\w가-힣]+/g,'-').replace(/^-+|-+$/g,''); }
  function splitRow(r){ return r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim();}); }

  function renderMd(md){
    var lines = md.replace(/\r\n/g,'\n').split('\n');
    if(lines[0] && lines[0].trim()==='---'){ var e=lines.indexOf('---',1); if(e>0) lines=lines.slice(e+1); }
    var out=[], i=0, toc=[];
    while(i<lines.length){
      var ln=lines[i];
      if(/^\s*$/.test(ln)){ i++; continue; }
      if(/^---+\s*$/.test(ln)){ out.push('<hr>'); i++; continue; }
      // fenced code block ```
      if(/^```/.test(ln)){
        var buf=[]; i++;
        while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
        i++; // 닫는 펜스 스킵
        out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
        continue;
      }
      var h=ln.match(/^(#{1,6})\s+(.*)$/);
      if(h){
        var lv=h[1].length, txt=h[2].trim(), id=slug(txt);
        out.push('<h'+lv+' id="'+id+'">'+inline(txt)+'</h'+lv+'>');
        if(lv===2||lv===3) toc.push({lv:lv,id:id,txt:txt});
        i++; continue;
      }
      // table
      if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /-/.test(lines[i+1]) && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
        var head=splitRow(ln); i+=2; var rows=[];
        while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(splitRow(lines[i])); i++; }

        t+='</tbody></table></div>'; out.push(t); continue;
      }
      // unordered list (+ task list: `- [x]` / `- [ ]`)
      if(/^\s*[-*]\s+/.test(ln)){
        var items=[];
        while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/,'')); i++; }
        var isTask = items.some(function(it){ return /^\[[ xX]\]\s?/.test(it); });
        if(isTask){
          out.push('<ul class="tasklist">'+items.map(function(it){
            var m=it.match(/^\[([ xX])\]\s?([\s\S]*)$/);
            if(m){ var done=m[1].toLowerCase()==='x'; return '<li class="task'+(done?' is-done':'')+'">'+inline(m[2])+'</li>'; }
            return '<li class="subnote">'+inline(it)+'</li>';
          }).join('')+'</ul>'); continue;
        }
        out.push('<ul>'+items.map(function(it){return '<li>'+inline(it)+'</li>';}).join('')+'</ul>'); continue;
      }
      // ordered list
      if(/^\s*\d+\.\s+/.test(ln)){
        var oi=[];
        while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ oi.push(lines[i].replace(/^\s*\d+\.\s+/,'')); i++; }
        out.push('<ol>'+oi.map(function(it){return '<li>'+inline(it)+'</li>';}).join('')+'</ol>'); continue;
      }
      // paragraph
      var para=[ln]; i++;
      while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6})\s/.test(lines[i]) && !/^---+\s*$/.test(lines[i])
            && !/^\s*\|.*\|\s*$/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])){
        para.push(lines[i]); i++;
      }
      out.push('<p>'+inline(para.join(' '))+'</p>');
    }
    return { html: out.join('\n'), toc: toc };

  var UI_STATE_LABEL = {
    '01-default':'기본 화면','02-card-add':'카드 추가','03-delete-card':'카드 삭제','04-logout':'로그아웃',
    '05-avatar-menu':'아바타 메뉴','06-crop':'프로필 크롭','07-info-tooltip':'인포 툴팁',
    '02-email-edit':'이메일 변경','03-password-edit':'비밀번호 변경','05-crop':'프로필 크롭',
    '02-confirm-active':'탈퇴 확인 활성','03-logout':'로그아웃'
  };
  function uiWidths(state){ return state==='01-default' ? ['1920','1200','390'] : ['1200','390']; }

  function buildUiGallery(){
    // 섹션 5 헤딩 찾기
    var heads = Array.prototype.slice.call(docEl.querySelectorAll('h2'));
    var anchor = heads.filter(function(h){ return /UI 화면 캡쳐/.test(h.textContent); })[0];
    if(!anchor) return;

    var gallery = document.createElement('div');
    gallery.className = 'ui-gallery';

    var tabs = document.createElement('div'); tabs.className = 'ui-tabs';
    var panelsWrap = document.createElement('div');

    UI_SPEC.order.forEach(function(page, pi){
      var conf = UI_SPEC.pages[page];
      var tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'ui-tab' + (pi===0?' is-active':'');
      tab.textContent = conf.label;
      tab.dataset.uiTab = page;
      tabs.appendChild(tab);

      var panel = document.createElement('div');
      panel.className = 'ui-panel' + (pi===0?' is-active':'');
      panel.dataset.uiPanel = page;

      conf.states.forEach(function(state){
        var st = document.createElement('div'); st.className = 'ui-state';
        var title = document.createElement('p'); title.className = 'ui-state__title';
        title.innerHTML = '<span class="n">'+state.split('-')[0]+'</span>' + (UI_STATE_LABEL[state]||state);
        st.appendChild(title);
        var shots = document.createElement('div'); shots.className = 'ui-shots';
        uiWidths(state).forEach(function(w){
          var fig = document.createElement('figure'); fig.className = 'ui-shot';
          var img = document.createElement('img');
          img.loading = 'lazy';
          img.alt = conf.label+' · '+(UI_STATE_LABEL[state]||state)+' · '+w+'px';
          img.src = encodeURI('image/UI 화면/'+page+'/'+page+'__'+w+'__'+state+'.png');
          var cap = document.createElement('figcaption'); cap.className = 'ui-shot__cap';
          cap.innerHTML = '<span class="w">'+w+'px</span>';
          fig.appendChild(img); fig.appendChild(cap);
          shots.appendChild(fig);
        });
        st.appendChild(shots);
        panel.appendChild(st);
      });
      panelsWrap.appendChild(panel);
    });

    gallery.appendChild(tabs);
    gallery.appendChild(panelsWrap);

    // 헤딩 다음 설명 문단들 뒤에 삽입
    var after = anchor;
    while(after.nextElementSibling && !/^H[12]$/.test(after.nextElementSibling.tagName)){
      after = after.nextElementSibling;
    }
    after.parentNode.insertBefore(gallery, after.nextSibling);

    // 탭 전환
    tabs.addEventListener('click', function(e){
      var btn = e.target.closest('[data-ui-tab]'); if(!btn) return;
      var key = btn.dataset.uiTab;
      tabs.querySelectorAll('.ui-tab').forEach(function(t){ t.classList.toggle('is-active', t===btn); });
      panelsWrap.querySelectorAll('.ui-panel').forEach(function(p){ p.classList.toggle('is-active', p.dataset.uiPanel===key); });
    });

    // 클릭 확대(라이트박스)
    gallery.addEventListener('click', function(e){
      var img = e.target.closest('.ui-shot img'); if(!img) return;
      openUiLightbox(img.src, img.alt);
    });
  }

  function openUiLightbox(src, alt){
    var lb = document.querySelector('[data-ui-lb]');
    if(!lb){
      lb = document.createElement('div'); lb.className = 'ui-lb'; lb.setAttribute('data-ui-lb','');
      lb.innerHTML = '<img alt="">';
      document.body.appendChild(lb);
      lb.addEventListener('click', function(){ lb.classList.remove('is-open'); });
      document.addEventListener('keydown', function(e){ if(e.key==='Escape') lb.classList.remove('is-open'); });
    }
    var im = lb.querySelector('img'); im.src = src; im.alt = alt||'';
    lb.classList.add('is-open');
  }

  // ---------- 선택 ----------
  function select(id){
    var r = reports.filter(function(x){return x.id===id;})[0];
    if(!r) return;
    current = r;
    var res = renderMd(r.md);
    docEl.innerHTML = res.html;
    if(id==='0722') buildUiGallery();
    buildToc(res.toc);
    crumbEl.textContent = r.title;
    document.title = r.title + ' | 상인월드';
    navEl.querySelectorAll('.nav__item').forEach(function(n){ n.classList.toggle('is-active', n.dataset.navItem===id); });
    if(window.lucide) window.lucide.createIcons();
    window.scrollTo(0,0);
    closeSidebar();
  }

  // ---------- 사이드바 ----------
  function buildNav(){
    // 카테고리(탭)별 그룹핑 — 첫 등장 순서 유지
    var cats=[], byCat={};
    reports.forEach(function(r){
      if(!byCat[r.category]){ byCat[r.category]=[]; cats.push(r.category); }
      byCat[r.category].push(r);
    });
    navEl.innerHTML = cats.map(function(cat){
      var items = byCat[cat].map(function(r){
        return '<a class="nav__item" data-nav-item="'+r.id+'">'
          +'<span class="nav__item-title">'+esc(r.title)+'</span>'
          +'<span class="nav__item-date">'+esc(r.date)+'</span></a>';
      }).join('');
      return '<div class="nav__group"><div class="nav__label">'+esc(cat)+'</div><div class="nav">'+items+'</div></div>';
    }).join('');
    navEl.querySelectorAll('.nav__item').forEach(function(n){
      n.addEventListener('click', function(){ select(n.dataset.navItem); });
    });
  }
  function openSidebar(){ sidebar.classList.add('is-open'); scrim.classList.add('is-open'); }
  function closeSidebar(){ sidebar.classList.remove('is-open'); scrim.classList.remove('is-open'); }
  document.querySelector('[data-menu]').addEventListener('click', openSidebar);
  scrim.addEventListener('click', closeSidebar);

  // ---------- 다크/라이트 테마 토글 (localStorage 저장, 미설정 시 시스템 따름) ----------
  (function(){
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('report-theme'); } catch(e){}
    if(saved==='dark'||saved==='light') root.setAttribute('data-theme', saved);
    var btn = document.querySelector('[data-theme-toggle]');
    if(btn) btn.addEventListener('click', function(){
      var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var cur = root.getAttribute('data-theme') || (sysDark ? 'dark' : 'light');
      var next = cur==='dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('report-theme', next); } catch(e){}
    });
  })();

  // ---------- 다운로드 ----------
  dlBtn.addEventListener('click', function(){
    if(!current) return;
    var blob = new Blob([current.md], {type:'text/markdown;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = current.file;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  // ---------- init ----------
  buildNav();
  if(reports.length) select(reports[0].id);
  if(window.lucide) window.lucide.createIcons();
})();
</script>
</body>
</html>
